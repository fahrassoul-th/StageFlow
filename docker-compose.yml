services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stageflow
      POSTGRES_PASSWORD: stageflow
      POSTGRES_DB: stageflow
    ports:
      - "5432:5432"
    volumes:
      - stageflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stageflow -d stageflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://stageflow:stageflow@db:5432/stageflow
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
    # Overrides the image's gunicorn CMD with a hot-reloading dev server.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  stageflow_db_data:
